name: SwingDeep

options:
  createIntermediateGroups: true
  developmentLanguage: ja
  xcodeVersion: "26.4"

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    PRODUCT_BUNDLE_IDENTIFIER: com.noz.SwingDeep
    PRODUCT_NAME: SwingDeep
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "20260710"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: false
    ENABLE_USER_SCRIPT_SANDBOXING: false
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym

targets:
  SwingDeep:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
      - path: Models
      - path: Resources
      - path: Services
      - path: ViewModels
      - path: Views
      - path: Assets.xcassets
      - path: Supporting
    info:
      path: Supporting/Info.plist
      properties:
        CFBundleDisplayName: GolfScan AI
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.sports
        NSCameraUsageDescription: ゴルフスイングを撮影して分析するためにカメラを使用します。
        NSMicrophoneUsageDescription: スイング動画を音声付きで撮影するためにマイクを使用します。
        NSPhotoLibraryUsageDescription: ゴルフスイング動画を選択して分析するために写真ライブラリを使用します。
        NSPhotoLibraryAddUsageDescription: 分析用に撮影した動画を保存するために写真ライブラリを使用します。
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSupportsIndirectInputEvents: true
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

schemes:
  SwingDeep:
    build:
      targets:
        SwingDeep: all
    run:
      config: Debug
    archive:
      config: Release
